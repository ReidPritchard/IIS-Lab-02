[project]
name = "acousticsensing"
version = "0.1.0"
description = "Real-time acoustic event recognition: detect, classify and react to short sounds"
readme = "README.md"
authors = [
    { name = "Reid Pritchard", email = "reidpritchard99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "p5>=0.9.0",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
acousticsensing = "acousticsensing.app:main"
acousticsensing-train = "acousticsensing.train:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
